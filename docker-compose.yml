version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: taskcloud-db
    environment:
      POSTGRES_USER: taskcloud
      POSTGRES_PASSWORD: taskcloud123
      POSTGRES_DB: taskcloud
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskcloud"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskcloud-backend
    environment:
      DATABASE_URL: postgresql://taskcloud:taskcloud123@db:5432/taskcloud
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: taskcloud-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
