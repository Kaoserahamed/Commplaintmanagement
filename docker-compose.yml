version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: complaint-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-complaints}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-complaints}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-complaints}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: complaint-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-complaints}:${POSTGRES_PASSWORD:-change_me_in_production}@db:5432/${POSTGRES_DB:-complaints}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DEBUG: ${DEBUG:-True}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: complaint-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
